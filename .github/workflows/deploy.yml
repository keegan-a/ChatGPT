name: Build and Deploy Budget Builder 95

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install dependencies
        run: npm ci
      - name: Build web bundle
        run: npm run build:web
      - name: Deploy to S3/CloudFront
        if: github.ref == 'refs/heads/main' && secrets.BUDGET95_DEPLOY_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BUDGET95_DEPLOY_BUCKET: ${{ secrets.BUDGET95_DEPLOY_BUCKET }}
          BUDGET95_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.BUDGET95_CLOUDFRONT_DISTRIBUTION_ID }}
        run: npm run deploy:web

  package-desktop:
    if: github.event_name == 'release'
    runs-on: windows-latest
    needs: build-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install dependencies
        run: npm ci
      - name: Prepare web bundle
        run: npm run build:web
      - name: Package desktop shells
        env:
          BUDGET95_BUILD_TAG: ${{ github.run_id }}
        run: npm run electron:build
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: budgetbuilder95-desktop
          path: release/**
